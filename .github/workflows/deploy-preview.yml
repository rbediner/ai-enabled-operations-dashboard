name: Deploy Preview

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview artifact
        run: npm run build

      - name: Publish to preview repo
        env:
          PREVIEW_REPO: rbediner/canopy-exec-dash-prt
          PREVIEW_PUBLISH_TOKEN: ${{ secrets.PREVIEW_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PREVIEW_PUBLISH_TOKEN" ]; then
            echo "PREVIEW_PUBLISH_TOKEN secret is not configured."
            echo "Add a token with write access to ${PREVIEW_REPO} to enable preview deploys."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${PREVIEW_PUBLISH_TOKEN}@github.com/${PREVIEW_REPO}.git" preview-repo
          rsync -av --delete dist/ preview-repo/
          touch preview-repo/.nojekyll

          cd preview-repo
          if git diff --quiet && git diff --cached --quiet; then
            echo "No preview changes to publish."
            exit 0
          fi

          git add -A
          git commit -m "Deploy preview from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin main
